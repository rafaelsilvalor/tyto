version: 2
updates:
  # The npm updater runs on whatever `packageManager` in package.json names, inside a
  # container whose only route to the network is a proxy. That pin is part of this
  # configuration, and it reads `packageManager pnpm@11.27.0` deliberately. pnpm 12
  # publishes a launcher rather than the program, and on the Corepack path — the one
  # Dependabot takes, because Corepack installs no optional dependencies — the launcher
  # downloads `@pnpm/exe.<target>` through a bare `fetch` that installs no dispatcher. It
  # therefore cannot honour HTTP(S)_PROXY, never leaves the container, and every `pnpm`
  # call after it exits 1 (TYTO-79, TYTO-82).
  #
  # Measured rather than assumed. pnpm 11.27.0 ships no launcher at all: no
  # `native-binary.mjs`, no `install.js`, no `@pnpm/exe.*` optional dependencies, and 21 MB
  # of JavaScript in `dist/` that Node runs directly. Moving the pin cost 101 lines of
  # `pnpm-lock.yaml` — pnpm 12 and its eight platform binaries leaving the file, and a
  # `settings:` header arriving — while 0 of the project's own 472 packages changed
  # resolution.
  #
  # Ruled out: staying on pnpm 12 and waiting for it to be fixed upstream. The downloader
  # in 12.4.1 is byte-identical to the one in 12.3.4, and nothing under `get-pnpm/`
  # mentions a proxy agent. Ruled out earlier, by TYTO-79: the grouping below, the
  # lockfile and the workspace layout, none of which the failing run ever reached.
  #
  # The grouping stays: one pull request a week is the point (TYTO-76).
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups: { dev: { dependency-type: development }, prod: { dependency-type: production } }
    ignore:
      # `typescript-eslint` refuses TS 7 by name — "typescript-eslint does not support
      # TS 7.0", https://github.com/typescript-eslint/typescript-eslint/issues/10940 — and
      # the declaration build calls a TS 6 API that TS 7 removed, dying at `@tyto/core`
      # with `Cannot read properties of undefined (reading 'useCaseSensitiveFileNames')`.
      # Two required checks, both on this one package.
      #
      # Without this entry it is not one bump that waits. `dev` is a single grouped pull
      # request, so the ten unrelated bumps beside it in #96 — and every dev bump after —
      # queue behind a TypeScript major (TYTO-84). Adopting TS 7 is a stack change and
      # wants an ADR; this entry is the holding position, not the decision.
      #
      # Narrow on purpose: the 7.x line only, so 8.x is still offered. Remove it when
      # typescript-eslint supports TS >= 7.1 and the ADR says to move.
      - dependency-name: typescript
        versions: ['7.x']
  # One group, not two: an action has no development/production split, and five separate
  # pull requests editing the same five workflows is five update-and-rerun cycles for what
  # is one decision — `main` requires branches to be up to date (TYTO-76).
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ['*'] } }
    ignore:
      # `changesets/action` v2 renamed every input and refuses to run against Changesets
      # CLI v2, which this repository is on — so the bump is a CLI migration rather than a
      # version number, and it is carded as TYTO-80. The reasoning lives beside the pin in
      # `release.yml`; `github-config.test.ts` is what makes the bump fail.
      #
      # Without this entry the refusal is not free. The `actions` group is one pull
      # request, so the weekly run updates the rejected one instead of opening another,
      # and every other action bump — a security one included — queues behind a migration
      # inside a pull request that cannot merge (TYTO-83).
      #
      # Narrow on purpose: only the 2.x line. A later major is still offered, and a broad
      # `version-update:semver-major` would silence this dependency for good. Remove the
      # whole entry with TYTO-80.
      - dependency-name: changesets/action
        versions: ['2.x']
