version: 2
updates:
  # The npm half of this file has never completed a run, and the cause is not in this file
  # — it is the `packageManager` pin. Dependabot honours `pnpm@12.3.4` from package.json
  # and installs it into the updater container, but pnpm 12 publishes a launcher rather
  # than the program: first run fetches `@pnpm/exe.<platform>`, and that fetch never
  # reaches the container's proxy, which is the only route out of it. So `pnpm -v` exits 1,
  # every `pnpm update --lockfile-only` after it exits 1, and all eleven dependencies fail
  # at `update_files` reporting `unknown_error` with no detail (TYTO-79). Measured in the
  # private job log of 2026-09-12: 0 of the proxy's 120 requests were for `@pnpm/exe`, and
  # the proxy recorded no error of its own.
  #
  # Ruled out: the `dev`/`prod` grouping, the lockfile and the workspace layout. Resolution
  # succeeds for every dependency — the log shows it finding each latest version — and the
  # run dies before any of the three is read. Not ruled out, and not ours: whether pnpm's
  # launcher could be made to honour the proxy. The lever this repository holds is the pin,
  # and moving it is a toolchain decision, not a fix for a robot.
  #
  # The grouping stays either way: one pull request a week is the point (TYTO-76).
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups: { dev: { dependency-type: development }, prod: { dependency-type: production } }
  # One group, not two: an action has no development/production split, and five separate
  # pull requests editing the same five workflows is five update-and-rerun cycles for what
  # is one decision — `main` requires branches to be up to date (TYTO-76).
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ['*'] } }
