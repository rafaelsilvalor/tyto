name: ci
on:
  pull_request:
  push: { branches: [main] }
concurrency: { group: 'ci-${{ github.ref }}', cancel-in-progress: true }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # `fetch-depth: 0` is the whole history, and it is here for one step: `changeset
        # status` asks git where this branch diverged from `main`, and the default shallow
        # clone has no `main` and no merge base — `Failed to find where HEAD diverged from
        # "main"`. Measured rather than reasoned: the step passed locally, where the history
        # is complete, and failed on the first CI run that had it.
        with: { lfs: true, fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Before the turbo run, because it is the cheap failure: seconds against two minutes,
      # and a reformat is the one fix a person can apply without reading the diff.
      #
      # **It ran nowhere until now, and three files had drifted.** `pnpm check` was
      # `turbo run typecheck lint test` and this job ran the same four tasks, so Prettier
      # was a script in `package.json` that nothing ever called — the same shape as the
      # desktop end-to-end suites before TYTO-111. `github-config.test.ts` fails if it stops
      # being run, or stops being run before a merge.
      - run: pnpm format:check
      # The changeset check below runs `git merge-base main HEAD`, and on a **pull request**
      # `actions/checkout` leaves no ref called `main` — it fetches into
      # `refs/remotes/origin/*` and checks out a detached merge commit. `fetch-depth: 0` above
      # gives the history; this gives the name.
      #
      # **Created only when it is missing, and that guard is the whole of this line.** On a
      # push to `main` the checkout *is* the branch, and `git branch -f main` refuses to
      # touch it: `cannot force update the branch 'main' used by worktree at …`. The step
      # was green on the pull request that added it and red on `main` ten minutes later —
      # the third distinct failure of one step, after the default depth and after the
      # missing ref.
      - run: git rev-parse --verify --quiet main >/dev/null || git branch main origin/main
      # **Every versioned package this pull request changed is named in a changeset the pull
      # request itself added** (ADR 0070, TYTO-155). It replaced a bare `changeset status`,
      # which only failed when `.changeset/` held no file at all: a branch editing
      # `packages/core` with no changeset passed whenever another card's was pending, and a
      # Dependabot bump went red whenever none was — which is right after every version PR.
      # The script prints one verdict per changed package; the exceptions are in its header
      # (devDependencies only, an empty changeset, Dependabot's dependency-only bumps, whose
      # changeset `release.yml` writes at release time).
      #
      # It still runs `changeset status` after its own verdict whenever `.changeset/` holds a
      # file, because that is the tool validating what `release.yml` will version — the mixed
      # ignored and not ignored file took `release` down on `main` twice while this job was
      # green (TYTO-109). It reads and writes nothing else.
      #
      # **Skipped on the version PR, and only there.** That pull request consumes every
      # changeset and rewrites every manifest, so it is the one whose changes legitimately
      # carry none (TYTO-134). Excluded by branch name and not by `always()` or
      # `continue-on-error`, so the step still fails a real pull request;
      # `github-config.test.ts` pins both halves.
      - if: github.head_ref != 'changeset-release/main'
        run: node tools/repo-checks/src/changeset-coverage.mjs --base main
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      - run: pnpm turbo typecheck lint test build
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: test-results, path: '**/test-results/**' }
