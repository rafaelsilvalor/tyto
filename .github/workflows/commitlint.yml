name: commitlint
# `edited` because the description is linted below and is edited after a PR opens; the
# three default types stay listed so the required `lint` context still reports on every push.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions: { contents: read }
concurrency: { group: 'commitlint-${{ github.ref }}', cancel-in-progress: true }
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Lint the commits on the branch
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
      # main takes squash merges, so the PR title becomes the commit message on main and
      # has to pass the same rules. The title goes through the environment rather than
      # `${{ }}` inside the script: interpolation happens before the shell runs, so a
      # title containing a quote or `$(…)` would be executed instead of linted.
      - name: Lint the PR title, which squash merge turns into the commit message
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
      # The squash body is the PR description, where a tool footer or a co-author trailer
      # would ride onto main (TYTO-234). It is markdown, so it gets the attribution rule
      # only — commitlint.description.config.js says why. Same `env:` rule as the title.
      - name: Lint the PR description, which squash merge turns into the commit body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: >-
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY"
          | pnpm exec commitlint --config commitlint.description.config.js
