name: desktop-e2e
# The two suites that launch a real Electron. Until TYTO-111 they ran in **no workflow at
# all**: `ci.yml` runs `pnpm turbo … test`, and `apps/desktop`'s `test` script points at
# `vitest.config.ts`, whose `include` is `shared/**` and `src/**` — the `e2e/` folder is
# reached only by `test:desktop` and `test:package`, and neither was in a workflow. So 71
# tests ran on a maintainer's machine or nowhere, including the three `webPreferences`
# flags ADR 0001 names and the packaging failure that opens no window at all (TYTO-15).
#
# `docs/architecture.md` is right that the suites do not belong in `pnpm check` — they
# download a ~246 MB Electron and open a window. That is the reason they are here, in a
# workflow of their own, rather than the reason they are nowhere.
#
# **Why this trigger, and what the other two would have cost.** A nightly (or push-only)
# schedule keeps every PR fast and finds a break within a day — but a day after it landed
# on `main`, which is the thing this repository already has too much of: `desktop.yml`
# runs on no pull request and that is exactly how the tag-prefix defect landed green
# (TYTO-97). Running them inside `desktop.yml`, before packaging, is cheapest in minutes
# and latest in discovery: a tag is pushed to release, not to find out. Running them here,
# on every pull request, is the only shape that reports before the merge — 455–487 s a run,
# whole, on 6 of 6 runs measured for TYTO-138 (see below: caching the Electron download
# was tried and measured, and bought nothing).
#
# **A required status check on `main` since TYTO-138 (ADR 0064), so there is no `paths:`
# filter.** A path-filtered workflow reports on most pull requests never, and a required
# context that never reports leaves them pending for good. Instead the first step reads the
# pull request's diff and decides: `tools/repo-checks/src/ci-scope.mjs` computes this
# suite's scope from the dependency graph of `@tyto/desktop` — every workspace package the
# app bundles, `apps/cli` that three suites compare against, and the root files every
# build reads. When nothing in it changed, every later step is skipped and the job summary
# says `skipped: no change under …` with the list, so a green that measured nothing says
# so. When the diff cannot be read, it runs. The old filter, `apps/desktop/**`, missed 13
# of the last 40 merged pull requests that changed something the app bundles.
#
# **`push` to `main` always runs the whole suite**: the script scopes pull requests only,
# and anything that reaches `main` is checked whatever it touched.
on:
  pull_request:
  push: { branches: [main] }
concurrency: { group: 'desktop-e2e-${{ github.ref }}', cancel-in-progress: true }
jobs:
  # The job name is the required context `main`'s protection stores; `github-config.test.ts`
  # pins it, and holds it unique among the jobs a pull request runs.
  desktop:
    runs-on: ubuntu-latest
    steps:
      # `lfs: true` because `raster.desktop.test.ts` compares against reference PNGs, and
      # `.gitattributes` routes `**/__fixtures__/**/*.png` through Git LFS. Without it those
      # files arrive as 130-byte pointers, `PNG.sync.read` fails on the first one, and the
      # comparison that was supposed to guard the rasterizer never runs — `ci.yml` has
      # carried the same flag since the visual suite existed (TYTO-133). It is fetched even
      # on a skip because it is 6 files and 0.15 MB.
      #
      # `fetch-depth: 2` is what the scope needs: `pull_request` checks out a merge commit,
      # and its first parent is the base the diff is read against.
      - uses: actions/checkout@v7
        with: { lfs: true, fetch-depth: 2 }
      # Before `setup-node`, on the runner's own Node: the script imports nothing, and the
      # point of a skip is not paying for the install.
      - id: scope
        run: node tools/repo-checks/src/ci-scope.mjs desktop
      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }

      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      # **There is no Electron cache here, and that is a measurement rather than an
      # omission.** The card asked for one. It was built — `actions/cache` on
      # `~/.cache/electron`, keyed on the Electron version read off the installed package —
      # run cold and then run warm, and the two runs are the same job to within noise:
      #
      #     cold (`Cache not found for input keys: electron-Linux-44.3.0`)
      #       e2e/tabs.desktop.test.ts, the file that pays for the download … 57.6 s
      #       job                                                               3 min 34 s
      #     warm (`Cache restored from key: electron-Linux-44.3.0`, 116.85 MiB)
      #       e2e/tabs.desktop.test.ts                                        … 58.2 s
      #       job                                                               3 min 31 s
      #
      # The premise was that a ~117 MB download is worth avoiding. On this runner it is not
      # one: Electron's CDN and GitHub's cache are the same few seconds apart, and the 58 s
      # is the 17 tests in that file, not the fetch. So the step bought nothing measurable
      # and spent 116.85 MiB of a 10 GB repository quota that evicts by least-recent-use —
      # against the pnpm store, which does save real time.
      #
      # Two things learned on the way that would otherwise have to be learned again. A
      # second entry for `~/.cache/electron-builder` cached nothing at all and said so once
      # per run (`Path Validation Error: Path(s) specified in the action for caching do(es)
      # not exist`): electron-builder repacks the zip out of `~/.cache/electron`, which is
      # why `test:package` costs 6 s here against ~70 s on a machine that fetches its own.
      # And `actions/cache` declares `post-if: success()`, so a red job saves nothing — the
      # first green run is always the one that would pay a download forward.
      #
      # Reinstating it is `actions/cache@v4` and two lines. Do that against a number, not
      # against the intuition that a big download must be expensive.

      # Chromium's shared libraries, which Electron is. `install-deps` and not
      # `install --with-deps`: this needs the system packages and **not** the browser —
      # `_electron.launch` runs the Electron in `node_modules`, so a downloaded Chromium
      # would be ~170 MB nothing opens. Xvfb on top, because `show: false` is not headless
      # on Linux: Electron still opens a display connection at startup and dies with
      # `Missing X server or $DISPLAY` without one.
      - if: steps.scope.outputs.run == 'true'
        run: pnpm exec playwright install-deps chromium
      - if: steps.scope.outputs.run == 'true'
        run: sudo apt-get install -y --no-install-recommends xvfb

      # `pnpm build`, not `pnpm --filter @tyto/desktop build` — the same rule `desktop.yml`
      # carries and for the same reason: on a fresh checkout the workspace packages have no
      # `dist/`, and the filtered form runs the package's script and nothing before it.
      - if: steps.scope.outputs.run == 'true'
        run: pnpm build

      # **3 min 13 s for the job when TYTO-111 measured it; 455–487 s by TYTO-138**, as the
      # suites grew. `test:package` was 6.4 s of it, measured on this workflow's own runs. `test:package` is that cheap because
      # `electron-builder` repacks the Electron `test:desktop` has already fetched, so the
      # two suites share one download whatever caching is or is not in front of them.
      #
      # **Three files at a time here, one everywhere else** (TYTO-235). The variable is read
      # by `vitest.desktop.config.ts`, whose default is serial because a maintainer's
      # machine has the memory this runner does not need to share.
      - if: steps.scope.outputs.run == 'true'
        env: { TYTO_E2E_WORKERS: 3 }
        run: xvfb-run -a pnpm --filter @tyto/desktop test:desktop
      # `!cancelled()` rather than nothing, so a red `test:desktop` does not hide whether
      # the package is also broken. They answer different questions and one run should
      # answer both.
      - if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        run: xvfb-run -a pnpm --filter @tyto/desktop test:package

      # **One artifact, and only since there is finally something in it.** The note this
      # replaces was right when it was written: these suites wrote nothing to disk, and a
      # step pointed at a path that never exists warns on every red run in a way that reads
      # like a second failure. `raster.desktop.test.ts` changed that — it writes into
      # `e2e/__diff__/` in exactly two cases, and both are cases where the file is the
      # answer:
      #
      #   * a pixel comparison went past tolerance, and the render and the diff are what a
      #     reviewer needs to tell a real regression from a re-record;
      #   * this platform has no glyph reference yet, and the render written here is the
      #     file to commit. A linux reference cannot be recorded on the maintainer's
      #     Windows machine, so downloading it from a run is the only way one ever exists
      #     (ADR 0028).
      #
      # `if-no-files-found: ignore` keeps the green path silent, which is the whole of what
      # the old note was protecting.
      - if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-raster-diffs
          path: apps/desktop/e2e/__diff__/
          if-no-files-found: ignore
          retention-days: 14
