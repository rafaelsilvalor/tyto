name: desktop-e2e
# The two suites that launch a real Electron. Until TYTO-111 they ran in **no workflow at
# all**: `ci.yml` runs `pnpm turbo … test`, and `apps/desktop`'s `test` script points at
# `vitest.config.ts`, whose `include` is `shared/**` and `src/**` — the `e2e/` folder is
# reached only by `test:desktop` and `test:package`, and neither was in a workflow. So 71
# tests ran on a maintainer's machine or nowhere, including the three `webPreferences`
# flags ADR 0001 names and the packaging failure that opens no window at all (TYTO-15).
#
# `docs/architecture.md` is right that the suites do not belong in `pnpm check` — they
# download a ~246 MB Electron and open a window. That is the reason they are here, in a
# workflow of their own, rather than the reason they are nowhere.
#
# **Why this trigger, and what the other two would have cost.** A nightly (or push-only)
# schedule keeps every PR fast and finds a break within a day — but a day after it landed
# on `main`, which is the thing this repository already has too much of: `desktop.yml`
# runs on no pull request and that is exactly how the tag-prefix defect landed green
# (TYTO-97). Running them inside `desktop.yml`, before packaging, is cheapest in minutes
# and latest in discovery: a tag is pushed to release, not to find out. Running them here,
# on every pull request, is the only shape that reports before the merge — 455–487 s a run,
# whole, on 6 of 6 runs measured for TYTO-138 (see below: caching the Electron download
# was tried and measured, and bought nothing).
#
# **A required status check on `main` since TYTO-138 (ADR 0064), so there is no `paths:`
# filter.** A path-filtered workflow reports on most pull requests never, and a required
# context that never reports leaves them pending for good. Instead the first job reads the
# pull request's diff and decides: `tools/repo-checks/src/ci-scope.mjs` computes this
# suite's scope from the dependency graph of `@tyto/desktop` — every workspace package the
# app bundles, `apps/cli` that three suites compare against, and the root files every
# build reads. When nothing in it changed, every job after it is skipped, the `scope` job's
# summary says `skipped: no change under …` with the list, and `desktop` goes green — so a
# green that measured nothing says so. When the diff cannot be read, it runs. The old
# filter, `apps/desktop/**`, missed 13 of the last 40 merged pull requests that changed
# something the app bundles.
#
# **`push` to `main` always runs the whole suite**: the script scopes pull requests only,
# and anything that reaches `main` is checked whatever it touched.
#
# **Five jobs since TYTO-307 (ADR 0100), where there was one.** `test:desktop` and
# `test:package` ran one after the other on one runner, and by 18/10 that was 724 s median:
# 490 s of `test:desktop` and 156 s of `test:package`, the rest setup. Now `scope` decides,
# `test:desktop` runs as two `shard` jobs, `test:package` as a `package` job beside them,
# `merge` joins the two shards' reports into one list, and `desktop` — the name `main`'s
# protection stores — runs last and rolls the others up. The jobs in between are not
# required contexts, and they do not need to be: `desktop` is red whenever one of them is.
on:
  pull_request:
  push: { branches: [main] }
concurrency: { group: 'desktop-e2e-${{ github.ref }}', cancel-in-progress: true }
jobs:
  # The decision, alone in a job, so the jobs after it can be skipped whole instead of step
  # by step.
  scope:
    runs-on: ubuntu-latest
    outputs: { run: '${{ steps.scope.outputs.run }}' }
    steps:
      # `fetch-depth: 2` is what the scope needs: `pull_request` checks out a merge commit,
      # and its first parent is the base the diff is read against. `lfs: true` is carried
      # here as in every checkout of this workflow; it is 6 files and 0.15 MB.
      - uses: actions/checkout@v7
        with: { lfs: true, fetch-depth: 2 }
      # On the runner's own Node: the script imports nothing, and the point of a skip is not
      # paying for the install.
      - id: scope
        run: node tools/repo-checks/src/ci-scope.mjs desktop

  # `test:desktop`, split in two by vitest's `--shard`, which divides the files over a hash
  # of their paths rather than by duration. Two and not more because each shard pays the
  # setup again (~70 s: install, Chromium's libraries, Xvfb, `pnpm build`), and at two the
  # two slowest files, `tab-drag` and `sticky-scroll`, land in different shards.
  # `fail-fast: false` so one red shard does not cancel the other: a run should say
  # everything that is broken, not the first thing.
  shard:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2] }
    steps:
      # `lfs: true` because `raster.desktop.test.ts` compares against reference PNGs, and
      # `.gitattributes` routes `**/__fixtures__/**/*.png` through Git LFS. Without it those
      # files arrive as 130-byte pointers, `PNG.sync.read` fails on the first one, and the
      # comparison that was supposed to guard the rasterizer never runs — `ci.yml` has
      # carried the same flag since the visual suite existed (TYTO-133).
      - uses: actions/checkout@v7
        with: { lfs: true }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # **There is no Electron cache here, and that is a measurement rather than an
      # omission.** The card asked for one. It was built — `actions/cache` on
      # `~/.cache/electron`, keyed on the Electron version read off the installed package —
      # run cold and then run warm, and the two runs are the same job to within noise:
      #
      #     cold (`Cache not found for input keys: electron-Linux-44.3.0`)
      #       e2e/tabs.desktop.test.ts, the file that pays for the download … 57.6 s
      #       job                                                               3 min 34 s
      #     warm (`Cache restored from key: electron-Linux-44.3.0`, 116.85 MiB)
      #       e2e/tabs.desktop.test.ts                                        … 58.2 s
      #       job                                                               3 min 31 s
      #
      # The premise was that a ~117 MB download is worth avoiding. On this runner it is not
      # one: Electron's CDN and GitHub's cache are the same few seconds apart, and the 58 s
      # is the 17 tests in that file, not the fetch. So the step bought nothing measurable
      # and spent 116.85 MiB of a 10 GB repository quota that evicts by least-recent-use —
      # against the pnpm store, which does save real time. Three jobs now download it
      # instead of one; that is three times the same few seconds.
      #
      # Two things learned on the way that would otherwise have to be learned again. A
      # second entry for `~/.cache/electron-builder` cached nothing at all and said so once
      # per run (`Path Validation Error: Path(s) specified in the action for caching do(es)
      # not exist`): electron-builder repacks the zip out of `~/.cache/electron`. And
      # `actions/cache` declares `post-if: success()`, so a red job saves nothing — the
      # first green run is always the one that would pay a download forward.
      #
      # Reinstating it is `actions/cache@v4` and two lines. Do that against a number, not
      # against the intuition that a big download must be expensive.

      # Chromium's shared libraries, which Electron is. `install-deps` and not
      # `install --with-deps`: this needs the system packages and **not** the browser —
      # `_electron.launch` runs the Electron in `node_modules`, so a downloaded Chromium
      # would be ~170 MB nothing opens. Xvfb on top, because `show: false` is not headless
      # on Linux: Electron still opens a display connection at startup and dies with
      # `Missing X server or $DISPLAY` without one.
      - run: pnpm exec playwright install-deps chromium
      - run: sudo apt-get install -y --no-install-recommends xvfb

      # `pnpm build`, not `pnpm --filter @tyto/desktop build` — the same rule `desktop.yml`
      # carries and for the same reason: on a fresh checkout the workspace packages have no
      # `dist/`, and the filtered form runs the package's script and nothing before it.
      - run: pnpm build

      # **Three files at a time per shard, one everywhere else** (TYTO-235). The variable is
      # read by `vitest.desktop.config.ts`, whose default is serial because a maintainer's
      # machine has the memory this runner does not need to share.
      #
      # `blob` writes this shard's results for `merge`; `default` keeps the log readable on
      # its own, which is where `[TYTO-186]` is grepped for. The blob gets a path of its own
      # because vitest 5's default, `.vitest/blob/`, is hidden, and `upload-artifact` leaves
      # hidden files out unless told otherwise.
      - env: { TYTO_E2E_WORKERS: 3 }
        run: >-
          xvfb-run -a pnpm --filter @tyto/desktop test:desktop
          --shard=${{ matrix.shard }}/2 --reporter=blob --reporter=default
          --outputFile.blob=blob-reports/blob-${{ matrix.shard }}-attempt-${{ github.run_attempt }}.json

      # `!cancelled()` so a red shard still hands its results to `merge`. One artifact per
      # shard **and per attempt** (TYTO-340), because of what a rerun did to the old names,
      # measured on run 39311187189 (PR #118), where `shard (2)` failed, `gh run rerun
      # --failed` reran it green, and `merge` stayed red with the attempt-1 failure:
      #
      #   * attempt 2's upload of `desktop-blob-2` did not fail and did not replace
      #     anything: attempt 1 had finalized artifact 12216591693, attempt 2 finalized
      #     12215717655 under the same name, both in the run;
      #   * attempt 2's `merge` saw both and downloaded 12216591693, attempt 1's. The
      #     download lists with `latest: true`, which keeps the **highest id** per name
      #     (`filterLatest` in `@actions/artifact`), and ids are not issued in time order —
      #     the later upload got the lower one. Which blob a rerun reads was a coin.
      #
      # `overwrite: true` was the other fix and is not this one: it deletes the old artifact
      # before the upload, but the delete is best effort and a failure of it is logged at
      # debug level only, so it can go back to the coin without a line in the log. With
      # the attempt in the name every blob of the run stays visible, and `merge` picks the
      # newest attempt per shard by the number it can read — a shard that passed in
      # attempt 1 and was not rerun keeps its attempt-1 blob.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-blob-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: apps/desktop/blob-reports/
          retention-days: 1

      # **The raster diffs, one artifact per job that can write them.**
      # `raster.desktop.test.ts` writes into `e2e/__diff__/` in exactly two cases, and both
      # are cases where the file is the answer:
      #
      #   * a pixel comparison went past tolerance, and the render and the diff are what a
      #     reviewer needs to tell a real regression from a re-record;
      #   * this platform has no glyph reference yet, and the render written here is the
      #     file to commit. A linux reference cannot be recorded on the maintainer's
      #     Windows machine, so downloading it from a run is the only way one ever exists
      #     (ADR 0028).
      #
      # `if-no-files-found: ignore` keeps the green path silent.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-raster-diffs-${{ matrix.shard }}
          path: apps/desktop/e2e/__diff__/
          if-no-files-found: ignore
          retention-days: 14

  # `test:package`: `electron-builder --dir`, then the app that came out. It answers a
  # different question from `test:desktop` — whether the package opens, not whether the
  # window behaves — so it runs beside the shards rather than after them, and a red shard
  # no longer hides whether the package is broken too. `[TYTO-48]`, `[TYTO-189]` and the
  # packaged `[TYTO-186]` print in this job's log.
  package:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { lfs: true }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install-deps chromium
      - run: sudo apt-get install -y --no-install-recommends xvfb
      - run: pnpm build
      - run: xvfb-run -a pnpm --filter @tyto/desktop test:package
      # `update.package.test.ts` writes a picture of the real window into `e2e/__diff__/`
      # for the PR.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-raster-diffs-package
          path: apps/desktop/e2e/__diff__/
          if-no-files-found: ignore
          retention-days: 14

  # The two shards' results as one list, so a reader looks in one log for the whole of
  # `test:desktop` instead of adding two up. `--merge-reports` runs no test and launches no
  # Electron: it reads the blobs and replays them through the reporter, and exits non-zero
  # when a test in them failed. `!cancelled()` so a red shard's failures are listed here
  # too.
  merge:
    needs: [scope, shard]
    if: ${{ !cancelled() && needs.scope.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Every attempt's blob of every shard, side by side: the file names carry the attempt
      # too, so `merge-multiple` overwrites nothing.
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-blob-*
          path: apps/desktop/blob-reports/
          merge-multiple: true
      # Then only the newest attempt of each shard stays, because `--merge-reports` replays
      # every file in the folder — two attempts of one shard would list the failure the
      # rerun fixed beside the pass. The log says which attempt each shard is read from.
      - working-directory: apps/desktop/blob-reports
        run: |
          for shard in $(ls blob-*-attempt-*.json | sed -E 's/^blob-([0-9]+)-attempt-[0-9]+\.json$/\1/' | sort -un); do
            attempts=$(ls blob-"$shard"-attempt-*.json | sort -V)
            newest=$(echo "$attempts" | tail -n 1)
            echo "shard $shard: reading $newest, of $(echo "$attempts" | wc -l) uploaded"
            echo "$attempts" | head -n -1 | xargs -r rm --
          done
      # `durations-reporter.ts` writes each file's time, `beforeAll` and `afterAll` included,
      # to `blob-reports/durations.json` for the budget below (TYTO-310, ADR 0105).
      - run: >-
          pnpm --filter @tyto/desktop exec vitest run --config vitest.desktop.config.ts
          --merge-reports=blob-reports --reporter=default
          --reporter=./e2e/durations-reporter.ts
      # **The time budget**: a file over the ceiling in `e2e-budget.json` turns this job red,
      # by name and seconds, unless it has a waiver with a reason and an owner card; the job
      # summary lists the slowest files. A step here and not a job of its own, because the
      # durations are already in this job and `github-config.test.ts` pins the job graph.
      # `!cancelled()` so a red test above still gets its files timed.
      - if: ${{ !cancelled() }}
        run: node tools/repo-checks/src/e2e-budget.mjs apps/desktop/blob-reports/durations.json

  # **The required context, and nothing but a verdict** (ADR 0100, amending ADR 0064). The
  # job name is the one `main`'s protection stores; `github-config.test.ts` pins it, holds
  # it unique among the jobs a pull request runs, and pins the condition below.
  #
  # `always()` because a job whose dependency failed is otherwise *skipped*, and branch
  # protection reads a skipped required check as passing. So it always runs and fails
  # itself: when `scope` did not succeed, when any job failed or was cancelled, and when a
  # job was skipped although `scope` said to run. A skip is green only when `scope` said
  # there was nothing to measure — and then every job after `scope` is skipped, and the
  # `scope` summary says why.
  desktop:
    needs: [scope, shard, package, merge]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          SCOPE: ${{ needs.scope.result }}
          RUN: ${{ needs.scope.outputs.run }}
          SHARD: ${{ needs.shard.result }}
          PACKAGE: ${{ needs.package.result }}
          MERGE: ${{ needs.merge.result }}
        run: echo "scope=$SCOPE (run=$RUN) shard=$SHARD package=$PACKAGE merge=$MERGE"
      - if: >-
          needs.scope.result != 'success'
          || contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || (needs.scope.outputs.run == 'true' && contains(needs.*.result, 'skipped'))
        run: |
          echo "::error::desktop-e2e is red: a job it rolls up failed, was cancelled, or was skipped although the scope said to run"
          exit 1
