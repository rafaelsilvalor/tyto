name: desktop
on:
  push: { tags: ['desktop-v*'] }
permissions: { contents: write }
jobs:
  build:
    strategy:
      matrix: { os: [macos-latest, windows-latest, ubuntu-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tyto/desktop build
      - run: pnpm --filter @tyto/desktop exec electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # signing: CSC_LINK / CSC_KEY_PASSWORD (mac/win) once a certificate exists
