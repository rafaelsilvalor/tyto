name: desktop
# **A pull request that changes the release runs it too, and uploads nothing** (TYTO-95). A
# tag is pushed to release, not to find out, and until this trigger the only run of this
# file a change ever got was the release itself — which is how the tag-prefix defect and the
# empty `CSC_LINK` on macOS were both found (TYTO-97, TYTO-98). So a pull request touching
# this file, the electron-builder configuration or the gate's own suite runs all three legs
# through the build and the packaged-app gate, and stops there: every step that can reach a
# release or a secret is `if: github.event_name == 'push'`, and `desktop-release.test.ts`
# fails if one is not. Not a required check, so the `paths:` filter cannot leave a pull
# request pending; the required `desktop` context in `desktop-e2e.yml` is unchanged.
on:
  push: { tags: ['desktop-v*'] }
  pull_request:
    paths:
      - .github/workflows/desktop.yml
      - apps/desktop/electron-builder.yml
      - apps/desktop/e2e/*.package.test.ts
permissions: { contents: write }
jobs:
  build:
    strategy:
      # One platform failing must not cancel the other two. `--publish always` uploads to the
      # same release from three jobs, so fail-fast would leave a release holding whichever
      # installers happened to finish first and no record of what was cancelled.
      fail-fast: false
      matrix: { os: [macos-latest, windows-latest, ubuntu-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      # No token left in the git config. Nothing here pushes — the publish step reads `GH_TOKEN`
      # from its own `env:` — and on a pull request the gate runs repository code with a token
      # this job's `contents: write` would otherwise have handed it.
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }

      # Before the install, because it is the cheap failure. electron-builder takes the
      # version from `apps/desktop/package.json` and the release name from the tag, and it
      # never compares them: `desktop-v0.2.0` over a package still reading `0.1.0` publishes
      # `Tyto Setup 0.1.0.exe` into a release called `desktop-v0.2.0`, green.
      #
      # `GITHUB_REF_NAME` is read as an environment variable rather than interpolated as
      # `${{ github.ref_name }}`; a tag is attacker-controllable text and `${{ }}` is
      # substituted before the shell parses the line. `shell: bash` because the Windows
      # runner would otherwise read this as PowerShell.
      - name: The tag names the version being packaged
        if: github.event_name == 'push'
        shell: bash
        run: |
          packaged="desktop-v$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$packaged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not name the packaged version; apps/desktop/package.json says $packaged"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      # `pnpm build`, not `pnpm --filter @tyto/desktop build`. The filtered form runs the
      # package's own script and nothing else, so on a fresh checkout — which every tag build
      # is — the workspace packages have no `dist/` and the bundle dies at
      # `Rolldown failed to resolve import "@tyto/core" from
      # "apps/desktop/src/main/plugins.ts"`. Turborepo's `^build` is what orders them, and
      # the root script is what reaches it.
      - run: pnpm build

      # **The gate: the packaged app opens, or this leg uploads nothing** (TYTO-95). The same
      # command `desktop-e2e.yml` runs on every scoped pull request, on all three runners —
      # `packaged.package.test.ts` packages with `electron-builder --dir` from the same
      # `electron-builder.yml`, so the fuses flipped and the asar hash written are the ones the
      # installers below carry, and it reads the fuse wire back out of the binary.
      # `update.package.test.ts` runs on Linux and prints its skip on the other two.
      #
      # It packages a second time rather than reusing the publish step's output: the card
      # allowed that only if it did not change what is tested, and the publish step comes
      # after the gate by construction. **Before the signing step**, so no certificate is in
      # the environment of a process running repository tests — which means that once
      # `CSC_LINK` exists the gate tests the unsigned pack and the installers are signed.
      # Today no certificate is configured and the two are the same build.
      #
      # Linux wants Chromium's shared libraries and a display, the arrangement
      # `desktop-e2e.yml` explains: `show: false` is not headless there.
      - if: runner.os == 'Linux'
        run: pnpm exec playwright install-deps chromium
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends xvfb
      - name: The packaged app opens before anything is uploaded
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a pnpm --filter @tyto/desktop test:package
          else
            pnpm --filter @tyto/desktop test:package
          fi

      # **A secret that does not exist is not an absent variable.** `${{ secrets.CSC_LINK }}`
      # in a step's `env:` writes the variable either way — to the empty string when no such
      # secret is configured — and electron-builder's two platforms disagree about what that
      # means:
      #
      #     // codeSign/windowsSignToolManager.js:76 — guards on empty
      #     if (cscLink == null || cscLink === "") return Promise.resolve(null);
      #     // macPackager.js:27 — does not
      #     if (cscLink == null || process.platform !== "darwin") return null;
      #
      # So on macOS `""` reads as *a certificate was provided*, `createKeychain` resolves it
      # as a path against the project directory, and the job dies at
      # `⨯ /Users/runner/work/tyto/tyto/apps/desktop not a file`. That is what the first real
      # tag found: Windows and Linux green, macOS red, on identical environment (TYTO-98).
      #
      # A step-level `env:` cannot express "absent", so the decision has to happen before the
      # write. The secrets reach this step through `env:` rather than `${{ }}` inside the
      # script, the same rule the tag guard above follows; the heredoc delimiter is random
      # because a certificate or a password may contain any fixed one.
      - name: Pass the signing certificate through only when there is one
        if: github.event_name == 'push'
        shell: bash
        run: |
          if [ -n "$SIGNING_CERTIFICATE" ]; then
            delimiter="csc-$RANDOM$RANDOM$RANDOM"
            printf 'CSC_LINK<<%s\n%s\n%s\n' "$delimiter" "$SIGNING_CERTIFICATE" "$delimiter" >> "$GITHUB_ENV"
            printf 'CSC_KEY_PASSWORD<<%s\n%s\n%s\n' "$delimiter" "$SIGNING_PASSWORD" "$delimiter" >> "$GITHUB_ENV"
            echo "signing with the configured certificate"
          else
            echo "no CSC_LINK secret; the installers will be unsigned"
          fi
        env:
          SIGNING_CERTIFICATE: ${{ secrets.CSC_LINK }}
          SIGNING_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      # Signing is optional and off. Unsigned, macOS warns on first open and Windows
      # SmartScreen does the same, which is the cost of not having a certificate yet. Setting
      # the two repository secrets is the whole of turning it on — the step above is what
      # makes *not* setting them work. Notarizing a macOS build additionally wants `APPLE_ID`,
      # `APPLE_APP_SPECIFIC_PASSWORD` and `APPLE_TEAM_ID`, and is a separate decision
      # (`docs/git-workflow.md`).
      - if: github.event_name == 'push'
        run: pnpm --filter @tyto/desktop exec electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
