name: labeler
on: pull_request_target
permissions: { contents: read, pull-requests: write }
# Keyed on the pull request and not on `github.ref`, which the sibling workflows use: on
# `pull_request` that expression is `refs/pull/<n>/merge` and already unique, but on
# `pull_request_target` it is the *base* branch, so every open PR against main shared one
# group and each new one cancelled the last (TYTO-77).
concurrency: { group: 'labeler-${{ github.event.pull_request.number }}', cancel-in-progress: true }
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # pull_request_target so the job can label PRs from forks, which the read-only
      # token of a fork `pull_request` run cannot do. Safe here only because the job
      # never checks out or executes the head branch — do not add a checkout step.
      - uses: actions/labeler@v7
        with: { sync-labels: true }
