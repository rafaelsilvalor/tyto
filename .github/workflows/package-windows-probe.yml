name: package-windows-probe
# Throwaway, TYTO-241: the one place a pull request packages on Windows, where electron-builder
# writes the asar hash. Reverted before the pull request is reported.
on:
  pull_request:
jobs:
  package-windows-probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @tyto/desktop test:package
