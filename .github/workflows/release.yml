name: release
on:
  push: { branches: [main] }
permissions: { contents: write, pull-requests: write }
jobs:
  release:
    runs-on: ubuntu-latest
    # `prepare: husky` runs on every install, so a CI checkout gets the commit-msg hook
    # as well. The commit Changesets makes here carries no Jira key, which commitlint
    # requires of a human commit, and the hook killed the job before it could open the
    # version PR. The rule stays as it is; the hook simply does not belong in CI.
    env: { HUSKY: 0 }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Pinned to v1 because this repository is on Changesets CLI v2, and v2 of the action
      # refuses to run against it: "use Changesets action v1 instead, which is compatible
      # with CLI v2." Moving to the action's v2 means moving the CLI to v3 first and
      # renaming all four inputs below, which is TYTO-78's other half — not a bump.
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset tag
          # The title is linted like any other, because squash merge turns it into the
          # commit on main and `lint` is a required check — without a key the version PR
          # would open and then never be mergeable. TYTO-0 is the key this repository
          # already uses for work no card asked for.
          commit: 'chore(release): TYTO-0 version packages'
          title: 'chore(release): TYTO-0 version packages'
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
