name: release
on:
  push: { branches: [main] }
# `packages: write` is for the contract step and nothing else (ADR 0149).
permissions: { contents: write, pull-requests: write, packages: write }
jobs:
  release:
    runs-on: ubuntu-latest
    # `prepare: husky` runs on every install, so a CI checkout gets the commit-msg hook
    # as well. The commit Changesets makes here carries no Jira key, which commitlint
    # requires of a human commit, and the hook killed the job before it could open the
    # version PR. The rule stays as it is; the hook simply does not belong in CI.
    env: { HUSKY: 0 }
    steps:
      # `fetch-depth: 0` for the Dependabot step below: it walks `main` back to the last
      # version-packages commit and reads each bump's manifests at its parent, none of which
      # the default single-commit clone has.
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # **The plugin contract goes to GitHub Packages** (ADR 0149, TYTO-444), on every push to
      # `main` and before changesets/action. The script skips every version the registry
      # already holds, so a push that moved none of the four publishes nothing, and a rerun
      # publishes nothing twice. Changesets itself never publishes: `changeset publish` would
      # upload all sixteen public packages.
      #
      # **Before the action, and with no `if`** (TYTO-448, the 2026-10-28 amendment to ADR
      # 0149). It used to run after it, only when `hasChangesets == 'false'` — and a changeset
      # `changeset version` cannot consume kept that true on every push, so the step was
      # skipped for good. After the action is no place for it either: when changesets are
      # left, v2 leaves this checkout on `changeset-release/main` with the *next* versions
      # written in, which are not released yet. Here the tree is `main`, whose versions move
      # only when a version PR merges. A failed upload fails the job before the version PR is
      # refreshed; that is on purpose, and a red release run reads "publish failed" first.
      - run: node tools/repo-checks/src/publish-contract.mjs
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      # The changesets Dependabot's merged bumps could not carry (ADR 0070, TYTO-155). One
      # file per package whose shipped dependencies a Dependabot commit since the last version
      # PR moved, naming each `dep old → new`; written to the working tree and never
      # committed, so the action below versions them into the version PR and the next run
      # writes them again until that PR is merged. A commit that already added a changeset by
      # hand is left alone. With no version-packages commit to stop at it fails, rather than
      # announce every bump in history again.
      - run: node tools/repo-checks/src/dependabot-changesets.mjs
      # The action's major and the CLI's major move together: v1 runs against Changesets
      # CLI v2, v2 against CLI v3, and each refuses the other outright. `@changesets/cli`
      # is v3 here, so this is v2 — the v1 pin TYTO-78 put in was for the CLI of the day
      # and stopped matching the moment the CLI moved (TYTO-80).
      #
      # All four inputs are renamed under v2, and getting that wrong is silent: an action
      # ignores an input it does not know rather than failing on it, so `commit:` and
      # `title:` would sit here meaning nothing and the version PR would open under the
      # action's own default title, "Version Packages" — a green run and a pull request
      # with no Jira key, unmergeable for good. `github-config.test.ts` pins the accepted
      # input names per major so the file cannot drift back into that.
      #
      # There is deliberately no `env: GITHUB_TOKEN` any more. v2 stopped reading that
      # variable — a custom token has to arrive through the `github-token` input — and the
      # input already defaults to `${{ github.token }}`, which is the token this step was
      # being handed. The line was removed because it had stopped doing anything, not
      # because the step stopped needing a token.
      - uses: changesets/action@v2
        id: changesets
        with:
          version-script: pnpm changeset version
          # `git-tag`, not `tag`: CLI v3 renamed the command. `tag` still runs and still
          # tags, printing "The 'tag' command is deprecated. Please use 'git-tag'
          # instead." — which is a countdown, not a pass.
          publish-script: pnpm changeset git-tag
          # The title is linted like any other, because squash merge turns it into the
          # commit on main and `lint` is a required check — without a key the version PR
          # would open and then never be mergeable. TYTO-0 is the key this repository
          # already uses for work no card asked for.
          commit-message: 'chore(release): TYTO-0 version packages'
          pr-title: 'chore(release): TYTO-0 version packages'
          # `push-with-git-cli` is deliberately absent, which leaves it false: v2 pushes
          # tags through the GitHub API, and an API ref is a lightweight tag. Setting it
          # true would restore v1's annotated tags, and what those actually carried was a
          # tagger reading `github-actions[bot]`, a date the commit already has, and a
          # message repeating the tag's own name — measured on `@tyto/core@0.19.0`, which
          # carries no signature either. `docs/git-workflow.md` has the decision;
          # `github-config.test.ts` fails if this line changes without it.
