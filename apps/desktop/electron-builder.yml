# What `desktop.yml` hands to electron-builder when a `desktop-v*` tag is pushed.
#
# The version is read from `package.json` and nowhere else, which is why the workflow refuses
# a tag that does not name it: electron-builder would happily build `0.1.0` under a tag called
# `desktop-v0.2.0` and publish it to a GitHub Release of that name.

appId: com.tyto.desktop
productName: Tyto

directories:
  # `release/` is already in `.gitignore`. `out/` is taken — it is where electron-vite writes
  # the three bundles this packages.
  output: release

# **The app is three bundles and one data folder, and that is the whole of it.**
#
# electron-vite already bundles `@tyto/core` and the rest into `out/main/index.js` — a
# deliberate choice, explained in `electron.vite.config.ts`, because a pnpm workspace's
# `node_modules` is a tree of symlinks and an installer built from one works on the machine
# that built it. So the default `files`, which collects every production dependency, ships a
# second copy of code the bundle already contains: measured at **2 161 entries and 20 196 010
# bytes** of `app.asar`, including 54 Turborepo build logs, 224 `src/` files and 68 test
# fixtures. Excluding `node_modules` and re-including one folder gives **27 entries and
# 2 015 370 bytes**.
#
# The folder that comes back is not code. `activateBuiltIns` reads the built-in template pack
# off disk at startup, and `builtInTemplatesDirectory()` finds it with
# `createRequire(...).resolve('@tyto/templates/package.json')` — a resolver call, so the pack
# has to be a real package inside the asar rather than bytes inside the bundle. Both lines
# earn their place: the `package.json` is what `resolve` answers with, and `templates/` is
# what the registry then reads.
#
# Dropping them is silent. Rebuilt without the re-include, the packaged app **opens no window
# at all** — `builtInTemplatesDirectory()` throws before `createMainWindow` is reached, the
# rejected promise has nobody to report it, and Playwright times out waiting for a first
# window. `e2e/packaged.package.test.ts` is that measurement, kept.
files:
  - out/**
  # The bundled Node goes beside the asar as an extra resource (below), never inside it: an
  # executable in an asar cannot be run (ADR 0050).
  - '!out/node/**'
  - package.json
  - '!node_modules/**'
  - node_modules/@tyto/templates/package.json
  - node_modules/@tyto/templates/templates/**
  # The second package that is bytes rather than code, and it came back for a different
  # reason than the first (TYTO-41). `@tyto/fonts` resolves its `fonts/` folder as `../fonts`
  # from its own module, so it is left out of the bundle by `electron.vite.config.ts` and has
  # to arrive here as a real package — `dist/` because the bundle now imports it at runtime,
  # `fonts/` because that is what it reads. Without it every render fails with
  # `@tyto/fonts lists Source Sans 3 700 normal but cannot read …`, which the E9.1 app never
  # hit because it never rendered anything.
  - node_modules/@tyto/fonts/package.json
  - node_modules/@tyto/fonts/dist/**
  - node_modules/@tyto/fonts/fonts/**

# **Installed plugins run on a Node of their own, which the package carries** (TYTO-186,
# ADR 0050). `pnpm build` puts Node's official binary for this platform, checked against the
# sha256 `bundled-node.json` pins, at `out/node/`; it lands at `resources/node/`, outside the
# asar, and its LICENSE with it. The plugin bootstrap is unpacked for the same reason: that
# Node is not Electron, and it cannot read a file inside an asar.
extraResources:
  - from: out/node
    to: node
asarUnpack:
  - out/guest/**

# **Three of Electron's fuses are switched off** (TYTO-193, TYTO-249, ADR 0067). A fuse is a byte in the executable that electron-builder flips after packing and
# before signing, so this applies to the packaged app only — never to the Electron in
# `node_modules` that `test:desktop` and `pnpm dev` run.
#
# - `runAsNode`: off. With it on, `ELECTRON_RUN_AS_NODE=1 Tyto.exe` is a plain Node any program
#   on the machine can drive. Plugins run on the bundled Node (ADR 0050), and their process
#   is started with `spawn`, because Electron refuses `fork` once this fuse is off.
# - `enableNodeOptionsEnvironmentVariable`: off. Nothing in the app reads `NODE_OPTIONS`, and
#   the test harness deletes it from the environment of the app it launches.
# - `enableNodeCliInspectArguments`: off (TYTO-249). With it on, `Tyto.exe --inspect` opens a
#   debugger on main, and any program on the machine can run code there. `test:package` used
#   to need it for Playwright's `_electron.launch`; it now drives the app over CDP
#   (`--remote-debugging-port`, a Chromium switch no fuse gates), which reaches the window and
#   its bridge but not main.
#
# **Two more are switched on** (TYTO-241, ADR 0067):
#
# - `enableEmbeddedAsarIntegrityValidation`: on. electron-builder writes the archive's hash
#   into `Tyto.exe`'s resources and into the macOS `Info.plist`, and Electron then refuses an
#   `app.asar` that no longer matches it. **Linux gets no hash**, so there the fuse checks
#   nothing; the packaged test prints that rather than asserting a refusal.
# - `onlyLoadAppFromAsar`: on. The app is only looked for in `app.asar`, never in an `app/`
#   folder put beside it. The unpacked guest, `resources/node` and the templates are files
#   the app reads, not where it loads from, and the packaged test still reaches all three.
#
# The others stay at Electron's default; ADR 0067 gives the reason for each.
# `e2e/packaged.package.test.ts` reads the wire back out of the packaged executable.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # Flipping a byte breaks the ad-hoc signature an arm64 macOS binary must carry to start.
  resetAdHocDarwinSignature: true

# Named rather than inferred. electron-builder can read the repository out of a
# `package.json`, but `apps/desktop/package.json` has no `repository` field and the one it
# falls back to is the workspace root's — a lookup that works today and says nothing about
# why. `--publish always` uploads here.
#
# **The release's tag is composed here, not read off the tag that triggered the run.** Those
# are two different strings and electron-builder never compares them: the workflow fires on
# `desktop-v*`, and the publisher builds its own name out of the version and a prefix it
# defaults —
#
#     // electron-publish/out/gitHubPublisher.js:38
#     this.tag = githubTagPrefix(info) + version;
#     // builder-util-runtime/out/publishOptions.js:10
#     if (options.tagNamePrefix) return options.tagNamePrefix;
#     if (options.vPrefixedTagName ?? true) return "v";
#
# — so with neither key set, `desktop-v0.1.0` in produced a release named `v0.1.0` out
# (TYTO-97). That is both the wrong name and a name this repository should not take: beside
# per-package tags like `@tyto/core@0.19.0`, a bare `v0.1.0` reads as a version of Tyto as a
# whole. `desktop-release.test.ts` now reads this string and `desktop.yml`'s trigger together,
# so changing one alone fails.
#
# **The installed app does not read this block to find its updates** (TYTO-131, ADR 0069).
# electron-updater's `github` provider would ask for the repository's _Latest_ release, and the
# `@tyto/*` package releases compete for that; the app looks up the newest `desktop-v*` release
# itself and reads `latest.yml` out of that one. What this block still decides is where the
# installers and `latest*.yml` are uploaded, and `app-update.yml`'s presence in the package.
publish:
  provider: github
  owner: rafaelsilvalor
  repo: tyto
  tagNamePrefix: desktop-v

# One installer per platform, and on Windows a second artifact that is not an installer.
#
# **`portable` is there because Windows is the only platform whose release artifact cannot be
# run without installing.** Linux ships an AppImage, which is a single runnable file by
# definition; macOS ships a `dmg` you mount and drag; Windows shipped `nsis` and nothing
# beside it, so handing somebody the app meant handing them an installer. A `portable` build
# is one self-extracting `.exe` that runs from wherever it sits — a folder, a stick, or beside
# another version of itself.
#
# **This is not the `zip`-beside-the-`dmg` case, and the difference is who downloads it.** No
# `zip` on macOS because electron-updater wants one only to *install*, and macOS installs an
# update only into a signed app, which Tyto is not (TYTO-131, ADR 0069): a Mac copy is told a
# newer version exists and sent to the release page. So the zip would be an artifact nothing
# downloads. Signing is what turns it on — the certificate, then a `zip` target here.
# The portable `.exe` is for a person, and the person exists now: the beta testers TYTO-130
# cuts the release for. `test:package`'s `--dir` build already covers *run the packaged app
# without installing it, here*; what it cannot do is leave the machine that built it, because
# what it leaves behind is a folder.
#
# macOS and Linux keep one target each, for the reason already written above.
#
# No `icon` anywhere, and that is checked rather than hoped. With none set, macOS and Windows
# use the icon embedded in the Electron skeleton, and `ElectronFramework.getDefaultIcon` hands
# Linux its bundled `electron-linux` set — so the AppImage build does not fail for the lack of
# one, it ships Electron's. Read out of `app-builder-lib`; not run on Linux from here. A real
# icon is design work and belongs to whoever draws it.
mac:
  target: dmg
win:
  target:
    - nsis
    - portable
linux:
  target: AppImage
  # Linux is the one platform that does not name the binary after `productName`. Its
  # packager falls back to `appInfo.sanitizedName.toLowerCase()` — the *package* name, which
  # here is `@tyto/desktop` — so without this the AppImage would ship an executable called
  # `@tyto-desktop`. Declared under `linux:` and not at the top level on purpose: the
  # top-level `executableName` also renames `Tyto.exe` and `Tyto.app`.
  executableName: tyto
  category: Graphics
