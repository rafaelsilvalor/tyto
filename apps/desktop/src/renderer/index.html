<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Content-Security-Policy in the page and not only in `webPreferences`: a policy the
      document carries survives being loaded from a dev server as well as from disk, and it
      is what stops a template's `src` from fetching anything. `connect-src 'none'` is the
      load-bearing one — the renderer talks to main through the preload bridge, never over
      the network.

      `font-src 'self' data:` is E9.2's addition, and it is about the preview rather than
      about this page. A `srcdoc` iframe inherits its parent's policy, and the document the
      preview shows carries its faces as `@font-face { src: url("data:font/woff2;...") }` —
      deliberately, because embedding them is what makes a render deterministic. Without this
      the frame would draw in a fallback face and look like a bug in the template.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'none'"
    />
    <!-- Painted from the catalogue on load; the literal is only what shows before scripts run. -->
    <title>Tyto</title>
    <link rel="stylesheet" href="./shell.css" />
  </head>
  <body>
    <main class="shell">
      <header class="shell__head">
        <h1 class="shell__name" data-i18n="app.name"></h1>
        <p class="shell__tagline" data-i18n="app.tagline"></p>
      </header>

      <div class="work">
        <section class="work__pane" aria-labelledby="editor-heading">
          <div class="work__bar">
            <h2 class="work__title" id="editor-heading" data-i18n="editor.heading"></h2>
            <!--
              The picker sits over the editor and not over the preview, because what it
              changes is a line of the brief. Choosing a template is an edit; the preview
              updating is the consequence, the same as it is for typing the line by hand.
            -->
            <label class="work__template">
              <span data-i18n="template.label"></span>
              <select id="template"></select>
            </label>
          </div>
          <!-- CodeMirror mounts here; empty until `main.ts` runs. -->
          <div class="editor" id="editor"></div>
        </section>

        <section class="work__pane" aria-labelledby="preview-heading">
          <div class="work__bar">
            <h2 class="work__title" id="preview-heading" data-i18n="preview.heading"></h2>
            <div class="preview__tabs" id="format-tabs" role="tablist"></div>
            <label class="preview__slide">
              <span id="slide-label" data-i18n="preview.slide.label"></span>
              <select id="slide"></select>
            </label>
            <div class="preview__zoom">
              <button type="button" id="zoom-out" data-i18n-title="preview.zoom.out">−</button>
              <output id="zoom-level"></output>
              <button type="button" id="zoom-in" data-i18n-title="preview.zoom.in">+</button>
              <button type="button" id="zoom-fit" data-i18n="preview.zoom.fit"></button>
            </div>
          </div>

          <div class="preview__stage" id="preview-stage">
            <div class="preview__paper" id="preview-paper" hidden>
              <!--
                `sandbox` with no tokens: unique origin, no scripts, no forms, no navigation.
                A preview document is a picture. The exporter emits no script and this is what
                makes that a property of the window rather than a habit of the exporter.
              -->
              <iframe id="preview-frame" sandbox="" title="Tyto"></iframe>
            </div>
            <p class="preview__empty" id="preview-empty" data-i18n="preview.empty"></p>
          </div>

          <p class="preview__status" id="preview-status"></p>
        </section>
      </div>

      <!--
        The panel spans both panes rather than sitting under the editor, because a
        diagnostic can come from any stage: a parse error is about the text on the left and
        an unresolved font is about the picture on the right, and a panel under one of them
        would be claiming the other's problems belong to it.
      -->
      <section class="problems" aria-labelledby="problems-heading">
        <div class="work__bar">
          <h2 class="work__title" id="problems-heading" data-i18n="problems.heading"></h2>
          <output class="problems__count" id="problems-count"></output>
        </div>
        <div class="problems__list" id="problems-list"></div>
      </section>

      <footer class="shell__foot">
        <label class="shell__language">
          <span data-i18n="shell.language.label"></span>
          <select id="locale"></select>
        </label>
        <dl class="shell__about">
          <dd data-i18n="shell.about.version"></dd>
          <dd data-i18n="shell.about.platform"></dd>
          <dd data-i18n="shell.about.templates"></dd>
        </dl>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
