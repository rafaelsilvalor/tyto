<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Content-Security-Policy in the page and not only in `webPreferences`: a policy the
      document carries survives being loaded from a dev server as well as from disk, and it
      is what stops a template's `src` from fetching anything. `connect-src 'none'` is the
      load-bearing one — the renderer talks to main through the preload bridge, never over
      the network.

      `font-src 'self' data:` is E9.2's addition, and it is about the preview rather than
      about this page. A `srcdoc` iframe inherits its parent's policy, and the document the
      preview shows carries its faces as `@font-face { src: url("data:font/woff2;...") }` —
      deliberately, because embedding them is what makes a render deterministic. Without this
      the frame would draw in a fallback face and look like a bug in the template.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'none'"
    />
    <!-- Painted from the catalogue on load; the literal is only what shows before scripts run. -->
    <title>Tyto</title>
    <link rel="stylesheet" href="./shell.css" />
  </head>
  <body>
    <main class="shell">
      <header class="shell__head">
        <h1 class="shell__name" data-i18n="app.name"></h1>
        <p class="shell__tagline" data-i18n="app.tagline"></p>
      </header>

      <!--
        Four empty docks and a splitter each, and **nothing here says what goes in them**
        (E9.10, ADR 0024). `dock.ts` reads the layout record, creates the element each open
        panel names, and puts it in its dock. A panel nobody has opened is never created, so
        it costs the repaint nothing.

        `left` is declared and empty on purpose: the templates list and the file tree are
        their own cards, and the dock that will hold them exists now so that adding one is
        an entry in a record rather than a change to this file.
      -->
      <div class="workspace">
        <div class="work" id="work">
          <div class="dock dock--left" data-dock="left" hidden></div>
          <div class="splitter" data-splitter="left" role="separator" aria-orientation="vertical" hidden></div>

          <div class="dock dock--centre" data-dock="centre"></div>

          <div class="splitter" data-splitter="right" role="separator" aria-orientation="vertical"></div>
          <div class="dock dock--right" data-dock="right"></div>
        </div>

        <div class="splitter splitter--row" data-splitter="bottom" role="separator" aria-orientation="horizontal"></div>
        <div class="dock dock--bottom" data-dock="bottom"></div>
      </div>

      <footer class="shell__foot">
        <label class="shell__language">
          <span data-i18n="shell.language.label"></span>
          <select id="locale"></select>
        </label>
        <dl class="shell__about">
          <dd data-i18n="shell.about.version"></dd>
          <dd data-i18n="shell.about.platform"></dd>
          <dd data-i18n="shell.about.templates"></dd>
        </dl>
      </footer>
    </main>
    <!--
      Outside `.shell`, because it covers the window rather than living in it. Empty until
      Mod-K: the element renders nothing while closed, so a palette nobody opened costs one
      element rather than a list of every command in the app.
    -->
    <tyto-command-bar></tyto-command-bar>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
