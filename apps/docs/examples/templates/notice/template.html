<!-- notice — the user manual's example template, in grid and story.

     Written to be read: the Briefs pages teach the language with briefs for this template, so
     it uses each kind of slot once and nothing a reader has to understand to follow them.
     "Source Sans 3" is a bundled font, so it draws the same on every machine. -->

<frame format="grid" bg="var(--bg)">
  <image slot="imagem" class="photo" />
  <text slot="titulo" class="title" />
  <text slot="subtitulo" class="sub" />
  <text slot="lamina" class="item" />
  <rect class="rule" />
</frame>

<frame format="story" extends="grid" />

<style>
  :root {
    --bg: #0c2340;
    --accent: #ff5900;
  }
  @if slot(tom) is laranja {
    :root {
      --bg: #ff5900;
      --accent: #0c2340;
    }
  }
  @if slot(tom) is verde {
    :root {
      --bg: #0f5132;
      --accent: #ffd166;
    }
  }

  /* The colours a {cor:…}text{/} mark in a brief can reach. */
  .cor-laranja {
    color: #ff5900;
  }
  .cor-amarelo {
    color: #ffd166;
  }

  .photo {
    x: 0;
    y: 0;
    w: 100%;
    h: 540;
  }
  .title {
    x: 80;
    y: 620;
    w: 920;
    font: 700 88px/1.05 "Source Sans 3";
    color: white;
  }
  .sub {
    x: 80;
    y: 860;
    w: 920;
    font: 400 40px/1.3 "Source Sans 3";
    color: white;
  }
  .item {
    x: 80;
    y: 1000;
    w: 920;
    font: 400 52px/1.15 "Source Sans 3";
    color: white;
  }
  .item.destaque {
    font: 700 60px/1.1 "Source Sans 3";
    color: var(--accent);
  }
  .rule {
    x: 80;
    y: 1240;
    w: 160;
    h: 12;
    fill: var(--accent);
  }

  @format story {
    .photo {
      h: 900;
    }
    .title {
      y: 980;
    }
    .sub {
      y: 1240;
    }
    .item {
      y: 1420;
    }
    .rule {
      y: 1780;
    }
  }

  @if slot(imagem) is empty {
    .title {
      y: 160;
    }
    .sub {
      y: 420;
    }
    .item {
      y: 600;
    }
  }
</style>
