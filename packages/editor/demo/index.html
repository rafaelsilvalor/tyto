<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>@tyto/editor — brief language</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }

      body {
        margin: 0;
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100vh;
      }

      header {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: center;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid rgb(128 128 128 / 35%);
      }

      h1 {
        font-size: 0.95rem;
        font-weight: 600;
        margin: 0;
        margin-right: auto;
      }

      label {
        display: flex;
        gap: 0.4rem;
        align-items: center;
        font-size: 0.85rem;
      }

      /* The editor fills what is left, and scrolls inside itself rather than growing the page. */
      #editor {
        min-height: 0;
        overflow: hidden;
      }

      #editor .cm-editor {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>@tyto/editor — brief language (TYTO-36)</h1>

      <label>
        Example
        <select id="example"></select>
      </label>

      <label>
        Theme
        <select id="theme">
          <option value="light">light</option>
          <option value="dark">dark</option>
        </select>
      </label>

      <label>
        <input id="read-only" type="checkbox" />
        read-only
      </label>

      <span id="status"></span>
    </header>

    <main id="editor"></main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
