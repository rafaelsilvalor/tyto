<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>paragraph-artwork:feed</title>
    <style>
      * { margin: 0; padding: 0; border: 0; box-sizing: border-box; }
      html, body { background: transparent; }
      .tyto-frame { position: relative; overflow: hidden; }
      .tyto-node { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
      .tyto-node > svg { display: block; width: 100%; height: 100%; }
      @font-face { font-family: "Inter"; font-weight: 400; font-style: normal; src: url("data:font/woff2;base64,Inter-400-normal"); }
      @font-face { font-family: "Inter"; font-weight: 700; font-style: normal; src: url("data:font/woff2;base64,Inter-700-normal"); }
      .tyto-frame { width: 400px; height: 400px; background-color: #fafafa; }
      #paragraphs { transform: matrix(1, 0, 0, 1, 20, 20); width: 360px; height: 170px; display: flex; flex-direction: column; justify-content: flex-end; text-align: left; font-family: "Inter"; font-size: 20px; font-weight: 700; line-height: 1.5; white-space: pre-wrap; overflow: hidden; }
      #control { transform: matrix(1, 0, 0, 1, 20, 210); width: 360px; height: 170px; display: flex; flex-direction: column; justify-content: center; text-align: left; font-family: "Inter"; font-size: 20px; font-weight: 700; line-height: 1.5; white-space: pre-wrap; overflow: hidden; }
    </style>
  </head>
  <body>
    <div class="tyto-frame"><div id="paragraphs" class="tyto-node"><div><span style="font-family: &quot;Inter&quot;; font-size: 20px; font-weight: 700; color: #141414">ORTOPEDISTA</span><br><span style="font-family: &quot;Inter&quot;; font-size: 20px; font-weight: 400; color: #141414">10-09 - 20h | Cuidado dos pés</span><br><span style="display: block; height: 24px"></span><span style="font-family: &quot;Inter&quot;; font-size: 20px; font-weight: 700; color: #141414">ORTOPEDISTA</span><br><span style="font-family: &quot;Inter&quot;; font-size: 20px; font-weight: 400; color: #141414">11-09 - 20h | Cuidado com a coluna</span></div></div><div id="control" class="tyto-node"><div><span style="font-family: &quot;Inter&quot;; font-size: 20px; font-weight: 700; color: #141414">ORTOPEDISTA</span><br><span style="font-family: &quot;Inter&quot;; font-size: 20px; font-weight: 400; color: #141414">10-09 - 20h | Cuidado dos pés</span><br><span style="font-family: &quot;Inter&quot;; font-size: 20px; font-weight: 700; color: #141414">ORTOPEDISTA</span><br><span style="font-family: &quot;Inter&quot;; font-size: 20px; font-weight: 400; color: #141414">11-09 - 20h | Cuidado com a coluna</span></div></div></div>
  </body>
</html>
