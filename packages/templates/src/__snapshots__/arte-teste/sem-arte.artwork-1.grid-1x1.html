<!doctype html>
<html>

      .tyto-frame { width: 1080px; height: 1080px; background-color: #f7f5f0; }
      #artwork-1\.grid-1x1\.fundo { width: 1080px; height: 1080px; outline: 9px solid #ff00aa; outline-offset: -9px; }
      #artwork-1\.grid-1x1\.titulo { transform: matrix(1, 0, 0, 1, 80, 80); width: 920px; height: 180px; display: flex; flex-direction: column; justify-content: flex-start; text-align: left; font-family: "Source Sans 3"; font-size: 72px; font-weight: 400; line-height: 1.1; white-space: pre-wrap; overflow: hidden; }

  </head>

    <div class="tyto-frame"><div id="artwork-1.grid-1x1.fundo" class="tyto-node" data-name="external-art:fundo"></div><div id="artwork-1.grid-1x1.titulo" class="tyto-node"><div><span style="font-family: &quot;Source Sans 3&quot;; font-size: 72px; font-weight: 400; color: #1f2933">Uma peça com arte </span><span style="font-family: &quot;Source Sans 3&quot;; font-size: 72px; font-weight: 700; color: #1f2933">pintada fora</span></div></div><div id="artwork-1.grid-1x1.imagem" class="tyto-node" data-name="external-art:imagem"></div></div>
  </body>
</html>
