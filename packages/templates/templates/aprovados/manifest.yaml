name: aprovados
version: 2.0.0
description: An exam's approved list on one slide — an emblem, the exam's name, and the approved grouped by specialty.
formats: [retrato]
slots:
  # The exam board's emblem over the words. Optional: a result with no emblem is still a
  # result, and the gap it would have taken closes up.
  imagem: { type: image }
  # The small words over the subtitle: "Resultado provisório", "Resultado final".
  chamada: { type: rich-text, max: 40 }
  subtitulo: { type: rich-text, max: 60 }
  # The exam's name, drawn large. Short by nature; a long one shrinks into its line.
  titulo: { type: rich-text, required: true, max: 30 }
  # The list. A line with no `|` starts a specialty, and every `rank | name` line under it is
  # one of its approved: `1º | Ana Souza`. The badge draws `1º Lugar`, and the name is set in
  # capitals whatever the brief typed.
  lista: { type: rich-text, required: true }
