name: aprovados
version: 4.0.0
description: An exam's approved list as a carousel — an emblem and the exam's name on the first slide, and the approved grouped by specialty on every slide.
formats: [grid]
slots:
  # The exam board's emblem over the words. Optional: a result with no emblem is still a
  # result, and the gap it would have taken closes up.
  imagem: { type: image }
  # The small words over the subtitle: "Resultado provisório", "Resultado final".
  chamada: { type: rich-text, max: 40 }
  subtitulo: { type: rich-text, max: 60 }
  # The four above make the title block, which is drawn on the first slide only.
  # The exam's name, drawn large. Short by nature; a long one shrinks into its line.
  titulo: { type: rich-text, required: true, max: 30 }
  # One slide each (TYTO-190), and the list is inside it, as the agenda's sessions are inside
  # its `lamina`. A line with no `|` starts a specialty, and every `rank | name` line under it
  # is one of its approved: `1º | Ana Souza`. The badge draws `1º Lugar`, and the name is set
  # in capitals whatever the brief typed. `max` counts slides here, not characters.
  lamina: { type: rich-text, repeat: true, min: 1, max: 12 }
