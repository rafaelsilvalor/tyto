name: promo-curso
version: 3.0.0
description: Course promotion with a teacher photo, a headline and a colour variant.
formats: [grid-1x1, story]
slots:
  titulo: { type: rich-text, required: true, max: 80 }
  subtitulo: { type: rich-text, max: 140 }
  imagem: { type: image }
  tom: { type: enum, values: [azul, laranja, verde], default: azul }
