name: tabela-roxo
version: 1.0.0
brand: roxo
description: roxo's table in one image — a title over the whole table, sized by measuring so every row fits one 1080×1350 post.
# The grid only: the piece is a feed post that people zoom into (the two approved table arts).
formats: [grid]
slots:
  # The words over the table, set in capitals. A line break in the brief is a line break on
  # the slide; otherwise the title wraps on its own, in at most three lines.
  titulo: { type: rich-text, required: true, max: 120 }
  # The table, as the table requests write it. The first line is the header and its `|` count
  # fixes the columns: `Concurso | Banca | Vagas | Salário`. Every later line with a `|` is a
  # row; a line with no `|` is a band across the whole table. Column widths, line breaks and
  # sizes are decided by measuring, and a value like `R$ 33.820,39` is never split.
  tabela: { type: rich-text, required: true }
# What a configuration may change (TYTO-438, ADR 0153). Each default is the token
# `@tyto/house-style/table-tokens` held before, so with nothing configured the table draws the
# same bytes; `template.test.ts` pins them equal. Lengths are px. The accent is the brand's.
values:
  # Title → table.
  title-gap: { type: length, default: 20, min: 0, max: 120 }
  # The title's size is measured between these.
  title-floor: { type: length, default: 40, min: 24, max: 96 }
  title-ceiling: { type: length, default: 96, min: 40, max: 160 }
  # The body's size is measured between these; below the floor the table overflows, reported.
  body-floor: { type: length, default: 16, min: 10, max: 34 }
  body-ceiling: { type: length, default: 34, min: 16, max: 60 }
  # How far a cell's words are lowered, in em, to centre capitals and digits by eye (TYTO-427).
  optical-drop: { type: number, default: 0.15, min: 0, max: 0.4 }
  paper: { type: color, default: '#fbfbfb' }
  ink: { type: color, default: '#000000' }
  zebra: { type: color, default: '#f2f2f4' }
  on-accent: { type: color, default: '#ffffff' }
  signature-ink: { type: color, default: '#8c8ca1' }
